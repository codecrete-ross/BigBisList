name: Release check

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Client dataset to verify
        type: choice
        options: [forever, anniversary]
        default: forever
  pull_request:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  release-check:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up MSVC
        uses: step-security/msvc-dev-cmd@v1

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install .

      - name: Resolve and validate release version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content -Raw Config.lua
          $match = [regex]::Match($config, '(?m)^\s*version\s*=\s*"(?<version>\d+\.\d+\.\d+)"\s*$')
          if (-not $match.Success) {
            throw "Could not resolve the fallback version from Config.lua."
          }
          $version = $match.Groups['version'].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $version) {
            throw "Tag $($env:GITHUB_REF_NAME) does not match Config.lua version $version."
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Run full release check
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_FLAVOR: ${{ inputs.flavor || 'forever' }}
          FOREVER_BASELINE: ${{ vars.FOREVER_LIVE_BASELINE_TAG }}
        run: |
          $python = (Get-Command python -CommandType Application | Select-Object -First 1).Source
          $arguments = @("-Version", $env:RELEASE_VERSION, "-Flavor", $env:RELEASE_FLAVOR, "-PythonPath", $python, "-FullData")
          if ($env:RELEASE_FLAVOR -eq "forever" -and $env:FOREVER_BASELINE) {
              & $python -m tools.forever_weekly eligible --baseline-tag $env:FOREVER_BASELINE *> $null
              if ($LASTEXITCODE -eq 0) { $arguments += @("-BaselineTag", $env:FOREVER_BASELINE) }
          }
          pwsh -NoProfile -File scripts/check-release.ps1 @arguments
          exit $LASTEXITCODE
